[package]
name = "rustykit"
version = "0.1.0"
authors = ["Lyrocs <cjuanole@gmail.com>"]
edition = "2021"
rust-version = "1.77"
description = "A Rust framework for ESP32-C6 touch LCD devices"

[lib]
name = "rustykit"

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.51", features = ["alloc"] }
embedded-graphics = "0.8"
embedded-hal = "1.0.0"
embedded-sdmmc = "0.8.1"
crossbeam-channel = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
embuild = "0.33"
