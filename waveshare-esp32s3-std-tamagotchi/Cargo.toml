[package]
name = "tamagotchi-std"
version = "0.1.0"
edition = "2021"
resolver = "2"

[workspace]

[[bin]]
name = "tamagotchi-std"
path = "src/main.rs"

[dependencies]
# ESP-IDF std support (using latest compatible versions)
esp-idf-hal = "0.45"
esp-idf-sys = { version = "0.36", features = ["binstart"] }

# Bevy ECS with std features
bevy_app = { version = "0.14", default-features = false, features = ["bevy_reflect"] }
bevy_ecs = { version = "0.14", default-features = false, features = ["bevy_reflect"] }

# Graphics
embedded-graphics = "0.8.1"
tinygif = "0.0.4"
tinybmp = "0.6.0"

# Threading and synchronization
crossbeam-channel = "0.5"
parking_lot = "0.12"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Time utilities
time = { version = "0.3", features = ["std"] }

# SD card support
embedded-sdmmc = "0.8.1"

# I2C/SPI device support (for touch and display)
embedded-hal = "1.0.0"
embedded-hal-bus = "0.2"

[profile.dev]
opt-level = "s"
debug = true

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
debug = false
strip = true

[build-dependencies]
embuild = "0.33"
